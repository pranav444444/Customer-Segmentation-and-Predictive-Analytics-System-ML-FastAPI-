grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 3
    verbose: 2

model_selection:
  module_0:
    class: XGBClassifier
    module: xgboost
    params:
      n_estimators: 300
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      eval_metric: "mlogloss"

    search_param_grid:
      n_estimators: [300]
      max_depth: [5]
      learning_rate: [0.05]
      subsample: [0.8]
      colsample_bytree: [0.8]